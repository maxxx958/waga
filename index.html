<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Wagi</title>
  <!-- Chart.js + Plugin do adnotacji -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 12px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    @media (min-width: 640px) {
      body { margin: 30px auto; padding: 0 20px; }
      .card { padding: 28px; }
    }
    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    @media (min-width: 640px) {
      h1 { font-size: 1.75rem; }
    }
    .btn-add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    @media (min-width: 480px) {
      .btn-add { width: auto; }
    }
    .btn-add:hover {
      background-color: #1d4ed8;
    }
    #status {
      text-align: center;
      color: #64748b;
      margin: 20px 0;
      font-style: italic;
    }
    .chart-container {
      position: relative;
      margin-top: 10px;
      width: 100%;
      height: 320px;
    }
    @media (min-width: 640px) {
      .chart-container { height: 400px; }
    }

    /* KARTY POSTĘPU DO CELU */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    @media (min-width: 640px) {
      .summary-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }
    .user-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      border-left: 5px solid #2563eb;
    }
    .user-card-header {
      font-weight: 700;
      font-size: 0.95rem;
      color: #334155;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .metrics-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 6px;
    }
    .metrics-row strong {
      color: #0f172a;
    }
    .progress-bar-bg {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-box">
      <h1>📈 Statystyki Wagi</h1>
      <a href="https://forms.gle/F9yion2uaa8fEgs97" target="_blank" rel="noopener" class="btn-add">
        ＋ Dodaj nową wagę
      </a>
    </div>

    <div id="status">Pobieranie najnowszych wpisów z Arkusza...</div>
    
    <div class="chart-container">
      <canvas id="wykresWagi"></canvas>
    </div>

    <div id="summaryGrid" class="summary-grid"></div>
  </div>

  <script>
    const SHEET_ID = '1MKqHQpjq6Z4b-9x9ubSUJkVgWinQA-w8VhMtkMVHahs';
    const TAB_NAME = 'arkusz';
    const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(TAB_NAME)}`;

    const KOLORY = [
      { main: '#2563eb', light: 'rgba(37, 99, 235, 0.25)' },   // Niebieski
      { main: '#dc2626', light: 'rgba(220, 38, 38, 0.25)' },   // Czerwony
      { main: '#16a34a', light: 'rgba(22, 163, 74, 0.25)' },   // Zielony
      { main: '#9333ea', light: 'rgba(147, 51, 234, 0.25)' },  // Fioletowy
      { main: '#ea580c', light: 'rgba(234, 88, 12, 0.25)' }    // Pomarańczowy
    ];

    function znajdzWartosc(row, mozliweKlucze) {
      for (const k of mozliweKlucze) {
        if (row[k] !== undefined && row[k] !== '') return row[k];
      }
      return null;
    }

    function obliczMediane(arr) {
      if (!arr || arr.length === 0) return null;
      const sorted = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 !== 0 
        ? sorted[mid] 
        : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    async function wczytajDane() {
      const statusEl = document.getElementById('status');
      
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Nie udało się pobrać danych z API');

        const rawData = await response.json();

        if (!rawData || rawData.length === 0) {
          statusEl.innerText = 'Brak danych w arkuszu.';
          return;
        }

        const datySet = new Set();
        const daneUzytkownikow = {};
        const celeWagi = {};
        const poczatkoweWagi = {};

        rawData.forEach(row => {
          const ts = znajdzWartosc(row, ['Sygnatura czasowa']) || '';
          const dataDzienna = ts.split(' ')[0];
          const email = znajdzWartosc(row, ['Adres e-mail']) || 'Użytkownik';
          const rawWaga = znajdzWartosc(row, ['Jaka waga byku?']);
          const rawCel = znajdzWartosc(row, ['Cel', 'Cel wagowy', 'Waga docelowa']);

          const wagaVal = parseFloat(String(rawWaga || '').replace(',', '.'));
          const celVal = parseFloat(String(rawCel || '').replace(',', '.'));

          if (!dataDzienna || isNaN(wagaVal)) return;

          datySet.add(dataDzienna);

          if (!daneUzytkownikow[email]) {
            daneUzytkownikow[email] = {};
            poczatkoweWagi[email] = wagaVal; // Pierwsza zanotowana waga
          }

          daneUzytkownikow[email][dataDzienna] = wagaVal;

          if (!isNaN(celVal)) {
            celeWagi[email] = celVal;
          }
        });

        const unikalneDaty = Array.from(datySet);
        const annotations = {};
        let kolorIdx = 0;
        const datasets = [];
        const podsumowanieHtml = [];

        Object.keys(daneUzytkownikow).forEach(email => {
          const palette = KOLORY[kolorIdx % KOLORY.length];
          kolorIdx++;

          // Linia celu na wykresie
          if (celeWagi[email]) {
            annotations[`cel_${email}`] = {
              type: 'line',
              yMin: celeWagi[email],
              yMax: celeWagi[email],
              borderColor: palette.main,
              borderWidth: 2,
              borderDash: [6, 6],
              label: {
                display: true,
                content: `Cel: ${celeWagi[email]} kg`,
                position: 'end',
                backgroundColor: palette.main,
                color: '#fff',
                font: { size: 10 }
              }
            };
          }

          const rawWagiSeries = unikalneDaty.map(data => daneUzytkownikow[email][data] ?? null);

          // Liczenie 7-dniowej mediany kroczącej do wykresu
          const medianySeries = rawWagiSeries.map((_, idx) => {
            const wagiWOkresie = [];
            for (let i = idx; i >= 0 && wagiWOkresie.length < 7; i--) {
              if (rawWagiSeries[i] !== null) {
                wagiWOkresie.push(rawWagiSeries[i]);
              }
            }
            return obliczMediane(wagiWOkresie);
          });

          // Surowe wpisy (jasne)
          datasets.push({
            label: `${email} (pomiary)`,
            data: rawWagiSeries,
            borderColor: palette.light,
            backgroundColor: palette.light,
            borderWidth: 1.5,
            tension: 0.1,
            spanGaps: true,
            pointRadius: 3,
            pointHoverRadius: 5
          });

          // Mediana 7d (gruba)
          datasets.push({
            label: `${email} (Mediana 7d)`,
            data: medianySeries,
            borderColor: palette.main,
            backgroundColor: palette.main,
            borderWidth: 3.5,
            tension: 0.3,
            spanGaps: true,
            pointRadius: 4,
            pointHoverRadius: 7
          });

          // POBIERAMY FAKTYCZNĄ OSTATNIĄ WAGĘ (zamiast mediany)
          const wagiIstniejace = rawWagiSeries.filter(w => w !== null);
          const ostatniaFaktycznaWaga = wagiIstniejace[wagiIstniejace.length - 1];
          const cel = celeWagi[email];
          const start = poczatkoweWagi[email];

          if (ostatniaFaktycznaWaga && cel) {
            const doPrzejsciaRazem = Math.abs(start - cel);
            const zrobiono = Math.abs(start - ostatniaFaktycznaWaga);
            
            let procent = doPrzejsciaRazem > 0 ? Math.round((zrobiono / doPrzejsciaRazem) * 100) : 100;
            if (procent > 100) procent = 100;
            if (procent < 0) procent = 0;

            const roznicaKg = Math.abs(ostatniaFaktycznaWaga - cel).toFixed(1);
            const kierunek = cel < ostatniaFaktycznaWaga ? 'do zrzucenia' : 'do przybrania';

            podsumowanieHtml.push(`
              <div class="user-card" style="border-left-color: ${palette.main}">
                <div class="user-card-header">${email}</div>
                <div class="metrics-row">
                  <span>Ostatni pomiar: <strong>${ostatniaFaktycznaWaga.toFixed(1)} kg</strong></span>
                  <span>Cel: <strong>${cel} kg</strong></span>
                </div>
                <div class="metrics-row">
                  <span>Pozostało: <strong>${roznicaKg} kg</strong> (${kierunek})</span>
                  <span>Osiągnięto: <strong>${procent}%</strong></span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${procent}%; background-color: ${palette.main}"></div>
                </div>
              </div>
            `);
          }
        });

        statusEl.style.display = 'none';
        document.getElementById('summaryGrid').innerHTML = podsumowanieHtml.join('');

        rysujWykres(unikalneDaty, datasets, annotations);

      } catch (err) {
        console.error('Błąd:', err);
        statusEl.innerText = 'Wystąpił błąd podczas ładowania danych.';
      }
    }

    function rysujWykres(etykiety, datasets, annotations) {
      const ctx = document.getElementById('wykresWagi').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: etykiety,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
              labels: { 
                usePointStyle: true, 
                padding: 10,
                font: { size: 11 }
              }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              title: { display: true, text: 'Waga [kg]' },
              ticks: { font: { size: 11 } }
            },
            x: {
              title: { display: true, text: 'Data' },
              ticks: { 
                font: { size: 10 },
                maxRotation: 45
              }
            }
          }
        }
      });
    }

    wczytajDane();
  </script>
</body>
</html>
