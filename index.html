<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Wagi</title>
  <!-- Chart.js + Wtyczka do linii (adnotacji) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
    }
    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }
    .btn-add:hover {
      background-color: #1d4ed8;
    }
    #status {
      text-align: center;
      color: #64748b;
      margin: 20px 0;
      font-style: italic;
    }
    .chart-container {
      position: relative;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-box">
      <h1>📈 Statystyki Wagi</h1>
      <a href="https://forms.gle/F9yion2uaa8fEgs97" target="_blank" rel="noopener" class="btn-add">
        ＋ Dodaj nową wagę
      </a>
    </div>

    <div id="status">Pobieranie najnowszych wpisów z Arkusza...</div>
    
    <div class="chart-container">
      <canvas id="wykresWagi"></canvas>
    </div>
  </div>

  <script>
    const SHEET_ID = '1MKqHQpjq6Z4b-9x9ubSUJkVgWinQA-w8VhMtkMVHahs';
    const TAB_NAME = 'arkusz';
    const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(TAB_NAME)}`;

    const KOLORY = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777'];

    function znajdzWartosc(row, mozliweKlucze) {
      for (const k of mozliweKlucze) {
        if (row[k] !== undefined && row[k] !== '') return row[k];
      }
      return null;
    }

    async function wczytajDane() {
      const statusEl = document.getElementById('status');
      
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Nie udało się pobrać danych z API');

        const rawData = await response.json();

        if (!rawData || rawData.length === 0) {
          statusEl.innerText = 'Brak danych w arkuszu.';
          return;
        }

        const datySet = new Set();
        const daneUzytkownikow = {};
        const celeWagi = {};

        rawData.forEach(row => {
          const ts = znajdzWartosc(row, ['Sygnatura czasowa']) || '';
          const dataDzienna = ts.split(' ')[0];
          const email = znajdzWartosc(row, ['Adres e-mail']) || 'Użytkownik';
          const rawWaga = znajdzWartosc(row, ['Jaka waga byku?']);
          const rawCel = znajdzWartosc(row, ['Cel', 'Cel wagowy', 'Waga docelowa']);

          const wagaVal = parseFloat(String(rawWaga || '').replace(',', '.'));
          const celVal = parseFloat(String(rawCel || '').replace(',', '.'));

          if (!dataDzienna || isNaN(wagaVal)) return;

          datySet.add(dataDzienna);

          if (!daneUzytkownikow[email]) {
            daneUzytkownikow[email] = {};
          }

          // Zapamiętujemy OSTATNI wpis z danego dnia
          daneUzytkownikow[email][dataDzienna] = wagaVal;

          // Jeśli w wierszu podano cel, zapisujemy go
          if (!isNaN(celVal)) {
            celeWagi[email] = celVal;
          }
        });

        const unikalneDaty = Array.from(datySet);
        const annotations = {};
        let kolorIdx = 0;

        const datasets = Object.keys(daneUzytkownikow).map(email => {
          const color = KOLORY[kolorIdx % KOLORY.length];
          kolorIdx++;

          // Dodajemy poziomą linię docelowej wagi w kolorze danego użytkownika
          if (celeWagi[email]) {
            annotations[`cel_${email}`] = {
              type: 'line',
              yMin: celeWagi[email],
              yMax: celeWagi[email],
              borderColor: color,
              borderWidth: 2,
              borderDash: [6, 6],
              label: {
                display: true,
                content: `Cel: ${celeWagi[email]} kg`,
                position: 'end',
                backgroundColor: color,
                color: '#fff',
                font: { size: 10 }
              }
            };
          }

          const serieWag = unikalneDaty.map(data => daneUzytkownikow[email][data] ?? null);

          return {
            label: email,
            data: serieWag,
            borderColor: color,
            backgroundColor: color,
            borderWidth: 3,
            tension: 0.25,
            spanGaps: true,
            pointRadius: 5,
            pointHoverRadius: 7
          };
        });

        // Ukrywamy komunikat ładowania DOPIERO po przetworzeniu danych
        statusEl.style.display = 'none';

        rysujWykres(unikalneDaty, datasets, annotations);

      } catch (err) {
        console.error('Błąd:', err);
        statusEl.innerText = 'Wystąpił błąd podczas ładowania danych. Sprawdź konsolę przeglądarki (F12).';
      }
    }

    function rysujWykres(etykiety, datasets, annotations) {
      const ctx = document.getElementById('wykresWagi').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: etykiety,
          datasets: datasets
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
              labels: { usePointStyle: true, padding: 15 }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              title: { display: true, text: 'Waga [kg]' }
            },
            x: {
              title: { display: true, text: 'Data wpisu' }
            }
          }
        }
      });
    }

    wczytajDane();
  </script>
</body>
</html>
